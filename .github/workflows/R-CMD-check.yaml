# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# NOTE: This workflow is overkill for most R packages and
# check-standard.yaml is likely a better choice.
# usethis::use_github_action("check-standard") will install it.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: windows-latest, r: "release" }
          - { os: windows-latest, r: "oldrel-1" }
          - { os: windows-latest, r: "oldrel-2" }
          - { os: windows-latest, r: "oldrel-3" }
          - { os: windows-latest, r: "oldrel-4" }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          extra-repositories: |
            https://posit-dev-shinycoreci.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sessioninfo
            rstudio/shinycoreci
            rappdirs
          needs: check
          cache: false
      # We know when libpath is utilized, the embeded nul error is present
      # - Local libpath caused an issue
      # - Does callr surface the error w/ libpath? No
      # - shinyverse repos caused an issue

      - name: Repo status
        shell: Rscript {0}
        run: |
          libpath <- "./local-lib"
          if (!dir.exists(libpath)) {
            dir.create(libpath, recursive = TRUE)
          }

          for (packages in list(
            c("rsconnect", "shiny", "shinytest2"),
            c("shiny", "shinytest2")
          )) {
            message("Starting callr to install: ")
            print(packages)

            withr::with_libpaths(
              libpath,
              {
                pak::pkg_install(
                  packages,
                  ask = FALSE, # Not interactive, so don't ask
                  upgrade = TRUE,
                  dependencies = NA
                )
              }
            )
          }
