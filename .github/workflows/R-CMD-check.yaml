# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# NOTE: This workflow is overkill for most R packages and
# check-standard.yaml is likely a better choice.
# usethis::use_github_action("check-standard") will install it.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: windows-latest, r: "release" }
          - { os: windows-latest, r: "oldrel-1" }
          - { os: windows-latest, r: "oldrel-2" }
          - { os: windows-latest, r: "oldrel-3" }
          - { os: windows-latest, r: "oldrel-4" }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          cache: false

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sessioninfo
            rstudio/shinycoreci
            rappdirs
          needs: check
          cache: false

      - name: Repo status
        shell: Rscript {0}
        run: |
          shinyverse_cran_url <- "https://posit-dev-shinycoreci.r-universe.dev"
          shinycoreci_libpath <- function() {
            # Dir location inspration from learnr:
            # https://github.com/rstudio/learnr/blob/1c01ac258230cbe217eee16c77cc71924faab1d3/R/storage.R#L275
            dir <- file.path(
              rappdirs::user_data_dir(),
              "R",
              "shinycoreci",
              paste0("R-", gsub(".", "_", getRversion(), fixed = TRUE))
            )
            # Provide a fully defined path. Things don't like to work without a fully defined path in pak
            if (!dir.exists(dir)) {
              dir.create(dir, recursive = TRUE)
            }
            # Must normalize after creating the directory to avoid warning
            dir <- normalizePath(dir)
            dir
          }
          libpath <- shinycoreci_libpath()

          for (packages in list(
            c("rsconnect", "shiny", "shinyjster", "shinytest2"),
            c("shiny", "shinytest2")
          )) {
            message("Starting callr to install: ")
            print(packages)

            callr::r(
              function(shinyverse_cran_url, packages, upgrade, dependencies) {
                options(repos = c(
                  # Use the shinycoreci universe to avoid GH rate limits!
                  "AAA" = shinyverse_cran_url,
                  getOption("repos", c("CRAN" = "https://cloud.r-project.org"))
                ))

                # Performing a leap of faith that pak is installed.
                # Avoids weird installs when using pak to install shinycoreci
                stopifnot(utils::packageVersion("pak") >= "0.3.0")
                pak__pkg_install <- utils::getFromNamespace("pkg_install", "pak")
                pak__pkg_install(
                  packages,
                  ask = FALSE, # Not interactive, so don't ask
                  upgrade = upgrade,
                  dependencies = dependencies
                )
              },
              list(
                shinyverse_cran_url = shinyverse_cran_url,
                packages = packages,
                upgrade = TRUE,
                dependencies = NA
              ),
              show = TRUE,
              libpath = libpath,
              supervise = TRUE,
              spinner = TRUE # helps with CI from timing out
            )
          }
